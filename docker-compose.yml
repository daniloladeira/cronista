# PostgreSQL do projeto. Ver docs/adr/0003-postgres-como-banco.md
#
#   docker compose up -d
#   docker compose logs -f db
#   docker compose down          (mantém os dados no volume)
#
# Credenciais vêm do .env, copie de .env.example antes de subir.

services:
  db:
    image: postgres:17-alpine
    container_name: cronista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Necessário para o stemming de português da busca (docs/08-modelo-de-dados.md)
      LANG: pt_BR.utf8
    ports:
      # Exposto apenas em localhost: o acesso remoto é pela API, nunca pelo banco.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cronista_test, o banco de testes (docs/14-plano-de-testes.md §7). Só
      # roda na primeira inicialização; ver o próprio script para o volume já
      # existente.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # Worker de transcrição (ADR-0014, docs/12-transcricao.md §7-9).
  #
  # Requer NVIDIA Container Toolkit instalado no WSL:
  #   sudo apt install -y nvidia-container-toolkit
  #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: cronista-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # NÃO reaproveitar o DATABASE_URL do .env: aquele aponta pro host
      # (127.0.0.1:5433, a porta remapeada). Dentro da rede do compose, o
      # worker fala com o serviço "db" na porta interna do Postgres (5432).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Idem: dentro do container a raiz do acervo é o ponto de montagem
      # abaixo, não o caminho do Windows que está em DATA_ROOT no .env
      # (docs/12-transcricao.md §8).
      DATA_ROOT: /data
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      WHISPER_IDLE_UNLOAD_SECONDS: ${WHISPER_IDLE_UNLOAD_SECONDS}
      WHISPER_VOCABULARY: ${WHISPER_VOCABULARY}
      WHISPER_FALLBACK_COMPUTE_TYPE: ${WHISPER_FALLBACK_COMPUTE_TYPE}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
    volumes:
      # Acervo montado somente-leitura. Fica no Windows de propósito:
      # gravar é irreversível, ler é repetível (ADR-0012, ADR-0014).
      - ${DATA_ROOT}:/data:ro
      - whisper-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
    name: cronista-pgdata
  whisper-models:
    name: cronista-whisper-models
